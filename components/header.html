<style id="canam-header-styles">
    .cam-skip-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10000;
        padding: 10px 16px;
        border-radius: 8px;
        color: #ffffff;
        background: #0d2247;
        font: 700 0.9rem/1.2 Inter, Arial, sans-serif;
        text-decoration: none;
        transform: translateY(-160%);
        transition: transform 160ms ease;
    }

    .cam-skip-link:focus {
        transform: translateY(0);
    }

    .cam-site-header {
        --cam-navy: #0d2247;
        --cam-blue: #1b3a6b;
        --cam-gold: #c8960c;
        --cam-gold-dark: #9f7405;
        --cam-text: #172033;
        --cam-muted: #5d687b;
        --cam-line: #e2e8f0;
        position: sticky;
        top: 0;
        z-index: 900;
        width: 100%;
        border-bottom: 1px solid rgba(226, 232, 240, 0.92);
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 30px rgba(13, 34, 71, 0.06);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .cam-site-header,
    .cam-site-header * {
        box-sizing: border-box;
    }

    .cam-header-shell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(1180px, calc(100% - 40px));
        min-height: 82px;
        margin: 0 auto;
        gap: 28px;
    }

    .cam-brand {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        text-decoration: none;
    }

    .cam-brand img {
        display: block;
        width: auto;
        height: 68px;
        max-width: 190px;
        object-fit: contain;
    }

    .cam-desktop-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        margin-left: auto;
    }

    .cam-nav-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--cam-text);
        font-size: 0.94rem;
        font-weight: 650;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
        transition: color 160ms ease;
    }

    .cam-nav-link::after {
        position: absolute;
        right: 0;
        bottom: 6px;
        left: 0;
        height: 2px;
        border-radius: 999px;
        background: var(--cam-gold);
        content: "";
        opacity: 0;
        transform: scaleX(0.4);
        transition: opacity 160ms ease, transform 160ms ease;
    }

    .cam-nav-link:hover,
    .cam-nav-link[aria-current="page"] {
        color: var(--cam-blue);
    }

    .cam-nav-link:hover::after,
    .cam-nav-link[aria-current="page"]::after {
        opacity: 1;
        transform: scaleX(1);
    }

    .cam-header-actions {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 12px;
    }

    .cam-phone-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        color: var(--cam-blue);
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
    }

    .cam-phone-link svg {
        width: 18px;
        height: 18px;
    }

    .cam-book-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 19px;
        border: 1px solid var(--cam-gold);
        border-radius: 999px;
        color: #ffffff;
        background: var(--cam-gold);
        box-shadow: 0 8px 22px rgba(159, 116, 5, 0.16);
        font-size: 0.9rem;
        font-weight: 750;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .cam-book-button:hover {
        border-color: var(--cam-gold-dark);
        background: var(--cam-gold-dark);
        transform: translateY(-1px);
    }

    .cam-menu-button {
        display: none;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 1px solid var(--cam-line);
        border-radius: 11px;
        color: var(--cam-navy);
        background: #ffffff;
        cursor: pointer;
    }

    .cam-menu-button svg {
        width: 22px;
        height: 22px;
    }

    .cam-menu-button .cam-close-icon,
    .cam-menu-button[aria-expanded="true"] .cam-menu-icon {
        display: none;
    }

    .cam-menu-button[aria-expanded="true"] .cam-close-icon {
        display: block;
    }

    .cam-mobile-nav {
        border-top: 1px solid var(--cam-line);
        background: #ffffff;
    }

    .cam-mobile-nav[hidden] {
        display: none !important;
    }

    .cam-mobile-nav-inner {
        display: grid;
        width: min(100% - 32px, 1180px);
        margin: 0 auto;
        padding: 14px 0 20px;
        gap: 2px;
    }

    .cam-mobile-nav .cam-nav-link {
        min-height: 48px;
        padding: 0 4px;
        border-bottom: 1px solid #f0f3f7;
    }

    .cam-mobile-nav .cam-nav-link::after {
        display: none;
    }

    .cam-mobile-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 14px;
        gap: 10px;
    }

    .cam-mobile-call {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        border: 1px solid var(--cam-blue);
        border-radius: 999px;
        color: var(--cam-blue);
        font-size: 0.9rem;
        font-weight: 750;
        text-decoration: none;
    }

    .cam-site-header a:focus-visible,
    .cam-site-header button:focus-visible {
        outline: 3px solid rgba(200, 150, 12, 0.42);
        outline-offset: 3px;
    }

    @media (max-width: 1080px) {
        .cam-desktop-nav {
            gap: 19px;
        }

        .cam-phone-link {
            display: none;
        }
    }

    @media (max-width: 860px) {
        .cam-header-shell {
            width: min(100% - 30px, 1180px);
            min-height: 74px;
        }

        .cam-brand img {
            height: 60px;
            max-width: 166px;
        }

        .cam-desktop-nav,
        .cam-header-actions > .cam-book-button {
            display: none;
        }

        .cam-menu-button {
            display: inline-flex;
        }
    }

    @media (max-width: 430px) {
        .cam-mobile-actions {
            grid-template-columns: 1fr;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .cam-skip-link,
        .cam-nav-link,
        .cam-nav-link::after,
        .cam-book-button {
            transition: none;
        }
    }
</style>
